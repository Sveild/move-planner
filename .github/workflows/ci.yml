name: CI

on:
  pull_request:
  push:
    branches: [main]


permissions:
  contents: read


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  single-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exactly one commit
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          echo "Commits in this pull request: $COMMITS"
          if [ "$COMMITS" -ne 1 ]; then
            echo "::error::This pull request has $COMMITS commits. Squash it into a single commit before merging."
            exit 1
          fi
